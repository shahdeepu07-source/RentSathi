<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SajiloRent — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       SAJILORENT DESIGN SYSTEM — v2.0
       Modern enterprise SaaS dashboard shell
       ============================================================ */

    /* ──────── RESET & ROOT ──────── */
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:           #0b1120;
      --bg-alt:       #0f172a;
      --surface:      #111827;
      --surface-2:    #1a2332;
      --border:       #1f2937;
      --border-light: #2a3a4e;
      --text:         #f1f5f9;
      --text-2:       #cbd5e1;
      --text-muted:   #64748b;
      --accent:       #2563eb;
      --accent-hover: #1d4ed8;
      --accent-subtle: rgba(37,99,235,0.12);
      --success:      #10b981;
      --success-bg:   rgba(16,185,129,0.12);
      --warn:         #f59e0b;
      --warn-bg:      rgba(245,158,11,0.12);
      --danger:       #ef4444;
      --danger-bg:    rgba(239,68,68,0.12);
      --info:         #06b6d4;
      --info-bg:      rgba(6,182,212,0.12);
      --radius-sm:    6px;
      --radius:       10px;
      --radius-lg:    14px;
      --shadow:       0 4px 24px rgba(0,0,0,0.3);
      --shadow-lg:    0 8px 40px rgba(0,0,0,0.4);
      --transition:   0.2s ease;
      --sidebar-w:    240px;
      --header-h:     60px;
    }
    html { font-size:15px; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ============================================================
       SIDEBAR
       ============================================================ */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform var(--transition);
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      min-height: var(--header-h);
    }
    .sidebar-brand img { height: 30px; width: auto; }
    .sidebar-brand span {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
    .sidebar-nav .nav-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 16px 10px 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--accent-subtle); color: var(--text); }
    .nav-item.active {
      background: var(--accent-subtle);
      color: var(--accent);
      font-weight: 600;
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin-left: -12px;
      padding-left: 21px;
    }
    .nav-item .nav-icon { font-size: 1.05rem; width: 22px; text-align: center; flex-shrink: 0; }
    .nav-item .nav-badge {
      margin-left: auto;
      background: var(--danger);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 20px;
      min-width: 18px;
      text-align: center;
    }
    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-footer .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--accent-subtle);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .sidebar-footer .user-meta { flex: 1; min-width: 0; }
    .sidebar-footer .user-name { font-size: 0.82rem; font-weight: 600; }
    .sidebar-footer .user-role { font-size: 0.68rem; color: var(--text-muted); }
    .sidebar-footer .logout-btn {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 1.1rem; padding: 4px;
      transition: color var(--transition);
    }
    .sidebar-footer .logout-btn:hover { color: var(--danger); }

    /* ============================================================
       MAIN CONTENT
       ============================================================ */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: var(--header-h);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 40;
      gap: 16px;
    }
    .main-header .page-title { font-size: 1.05rem; font-weight: 600; }
    .main-header .header-actions { display: flex; align-items: center; gap: 12px; }
    .main-header .header-actions .role-badge {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 12px;
      border-radius: 20px;
      background: var(--accent-subtle);
      color: var(--accent);
    }
    .main-body { flex: 1; padding: 24px 28px; overflow-y: auto; }

    /* ============================================================
       NOTIFICATION BANNERS
       ============================================================ */
    .notif-strip {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notif-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius);
      border-left: 4px solid var(--info);
      background: var(--surface-2);
      font-size: 0.85rem;
      animation: notifSlideIn 0.35s ease;
    }
    .notif-banner.urgent { border-left-color: var(--danger); background: var(--danger-bg); }
    .notif-banner.high   { border-left-color: var(--warn);   background: var(--warn-bg); }
    .notif-banner.normal { border-left-color: var(--info);   background: var(--info-bg); }
    .notif-banner .notif-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
    .notif-banner .notif-body { flex: 1; min-width: 0; }
    .notif-banner .notif-title { font-weight: 600; font-size: 0.88rem; }
    .notif-banner .notif-msg  { color: var(--text-2); margin-top: 2px; }
    .notif-banner .notif-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
    .notif-banner .notif-dismiss {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 1.1rem; padding: 2px; line-height: 1;
      transition: color var(--transition);
    }
    .notif-banner .notif-dismiss:hover { color: var(--text); }

    @keyframes notifSlideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       UTILITY — content placeholder grid
       ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-card .stat-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.4px; }
    .stat-card .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
    .stat-card .stat-value.accent  { color: var(--accent); }
    .stat-card .stat-value.success { color: var(--success); }
    .stat-card .stat-value.warn    { color: var(--warn); }
    .stat-card .stat-value.danger  { color: var(--danger); }

    .content-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .content-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
    .placeholder-text { color: var(--text-muted); font-size: 0.85rem; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    .sidebar-toggle {
      display: none;
      background: none; border: none;
      color: var(--text); font-size: 1.3rem;
      cursor: pointer; padding: 4px;
    }
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 45;
    }
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .overlay.open { display: block; }
      .main { margin-left: 0; }
      .sidebar-toggle { display: block; }
      .main-header { padding: 0 16px; }
      .main-body  { padding: 16px; }
    }

    /* ─── Role-specific accent overrides (optional flair) ─── */
    .role-superadmin .nav-item.active { color: #f472b6; border-left-color: #f472b6; }
    .role-admin      .nav-item.active { color: #38bdf8; border-left-color: #38bdf8; }
    .role-owner      .nav-item.active { color: #fbbf24; border-left-color: #fbbf24; }
    .role-tenant     .nav-item.active { color: #34d399; border-left-color: #34d399; }
  </style>
</head>
<body>

<!-- ============================================================
     SIDEBAR
     ============================================================ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img src="/logo.svg" alt="SajiloRent">
    <span>SajiloRent</span>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <!-- Dynamically injected by JS -->
  </nav>
  <div class="sidebar-footer">
    <div class="avatar" id="userAvatar">K</div>
    <div class="user-meta">
      <div class="user-name" id="userDisplayName">User</div>
      <div class="user-role" id="userDisplayRole">Role</div>
    </div>
    <button class="logout-btn" id="logoutBtn" title="Sign out">⏻</button>
  </div>
</aside>

<!-- Mobile overlay -->
<div class="overlay" id="sidebarOverlay"></div>

<!-- ============================================================
     MAIN CONTENT
     ============================================================ -->
<div class="main" id="mainArea">

  <!-- HEADER BAR -->
  <header class="main-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <span class="page-title" id="pageTitle">Dashboard</span>
    </div>
    <div class="header-actions">
      <span class="role-badge" id="headerRoleBadge">SuperAdmin</span>
      <span style="font-size:0.85rem;color:var(--text-muted);" id="headerTimestamp"></span>
    </div>
  </header>

  <!-- BODY -->
  <div class="main-body" id="mainBody">

    <!-- ───── NOTIFICATION BANNERS (top) ───── -->
    <div class="notif-strip" id="notifStrip"></div>

    <!-- ───── PAGE CONTENT ───── -->
    <div id="pageContent">
      <!-- Injected per-role by JS -->
    </div>

  </div>
</div>

<!-- ============================================================
     APPLICATION SCRIPT
     ============================================================ -->
<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SAJILORENT — Dashboard Controller
// Modular role-adapting shell with hierarchical notifications
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

class DashboardApp {
  constructor() {
    this.user = null;
    this.notifications = [];
    this.activeNav = 'overview';

    // Role → display metadata
    this.roleMeta = {
      superadmin: { label: 'SuperAdmin', color: '#f472b6', icon: '⚙️' },
      admin:      { label: 'Admin',      color: '#38bdf8', icon: '🏢' },
      owner:      { label: 'Owner',      color: '#fbbf24', icon: '🏠' },
      tenant:     { label: 'Tenant',     color: '#34d399', icon: '👤' }
    };

    // Per-role navigation items
    this.navConfig = {
      superadmin: [
        { id: 'overview',  icon: '📊', label: 'Platform Overview' },
        { id: 'admins',    icon: '👥', label: 'Manage Admins' },
        { id: 'owners',    icon: '🏘️', label: 'All Owners' },
        { id: 'houses',    icon: '🏠', label: 'All Properties' },
        { id: 'settings',  icon: '⚙️', label: 'System Settings', divider: true },
        { id: 'audit',     icon: '📋', label: 'Audit Log' }
      ],
      admin: [
        { id: 'overview',  icon: '📊', label: 'Dashboard' },
        { id: 'owners',    icon: '🏘️', label: 'Manage Owners' },
        { id: 'houses',    icon: '🏠', label: 'Properties' },
        { id: 'tenants',   icon: '👥', label: 'All Tenants' },
        { id: 'bills',     icon: '🧾', label: 'Bills Overview', divider: true },
        { id: 'trash',     icon: '🗑️', label: 'Trash' }
      ],
      owner: [
        { id: 'overview',  icon: '📊', label: 'Dashboard' },
        { id: 'billing',   icon: '⚡', label: 'Create Bill' },
        { id: 'tenants',   icon: '👥', label: 'Tenants' },
        { id: 'history',   icon: '📜', label: 'Bill History', divider: true },
        { id: 'reports',   icon: '📈', label: 'Reports' }
      ],
      tenant: [
        { id: 'overview',  icon: '📊', label: 'My Dashboard' },
        { id: 'bills',     icon: '🧾', label: 'My Bills' },
        { id: 'payments',  icon: '💰', label: 'Payment History', divider: true },
        { id: 'profile',   icon: '👤', label: 'Profile' }
      ]
    };

    // Role → demo page content
    this.pageContent = {
      superadmin: `<div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Platform Owners</div><div class="stat-value accent">24</div></div>
        <div class="stat-card"><div class="stat-label">Total Tenants</div><div class="stat-value success">187</div></div>
        <div class="stat-card"><div class="stat-label">Properties</div><div class="stat-value warn">38</div></div>
        <div class="stat-card"><div class="stat-label">Active Admins</div><div class="stat-value danger">3</div></div>
      </div>
      <div class="content-card"><h3>⚙️ System Health</h3><p class="placeholder-text">All services operational. Monthly revenue tracking enabled. View audit log for recent activity.</p></div>
      <div class="content-card"><h3>📋 Recent Activity</h3><p class="placeholder-text">No recent anomalies. 12 bills were generated in the last 24 hours.</p></div>`,

      admin: `<div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Owners</div><div class="stat-value accent">24</div></div>
        <div class="stat-card"><div class="stat-label">Tenants</div><div class="stat-value success">187</div></div>
        <div class="stat-card"><div class="stat-label">Houses</div><div class="stat-value warn">38</div></div>
        <div class="stat-card"><div class="stat-label">Pending Bills</div><div class="stat-value danger">14</div></div>
      </div>
      <div class="content-card"><h3>👥 Owner Onboarding</h3><p class="placeholder-text">Manage property owners, approve registrations, and oversee platform operations.</p></div>`,

      owner: `<div class="stats-grid">
        <div class="stat-card"><div class="stat-label">My Tenants</div><div class="stat-value accent">5</div></div>
        <div class="stat-card"><div class="stat-label">Pending Bills</div><div class="stat-value warn">3</div></div>
        <div class="stat-card"><div class="stat-label">Collected (This Month)</div><div class="stat-value success">Rs. 72,150</div></div>
        <div class="stat-card"><div class="stat-label">Outstanding</div><div class="stat-value danger">Rs. 43,260</div></div>
      </div>
      <div class="content-card"><h3>⚡ Quick Actions</h3><p class="placeholder-text">Generate bills, manage tenants, and view payment history from the navigation menu.</p></div>`,

      tenant: `<div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Current Balance</div><div class="stat-value warn" id="tenantBalance">Rs. 14,420</div></div>
        <div class="stat-card"><div class="stat-label">Last Bill</div><div class="stat-value accent">Rs. 14,420</div></div>
        <div class="stat-card"><div class="stat-label">Status</div><div class="stat-value" style="color:var(--warn);">Unpaid</div></div>
      </div>
      <div class="content-card"><h3>📄 Current Bill</h3><p class="placeholder-text">Your latest bill for Jestha 2083 is ready. Click "My Bills" to view details and download.</p></div>`
    };
  }

  // ─── Initialize with a mock user (role-switchable for demo) ──
  init(role = 'owner') {
    this.setUser({
      id: 1,
      username: role === 'superadmin' ? 'kali' :
                role === 'admin' ? 'admin' :
                role === 'owner' ? 'ram_sharma' : 'ranjita',
      fullName: role === 'superadmin' ? 'Kali' :
                role === 'admin' ? 'Admin User' :
                role === 'owner' ? 'Ram Sharma' : 'Ranjita Tamang',
      role
    });
    this.render();
  }

  setUser(user) {
    this.user = user;
    document.getElementById('mainArea').className = `main role-${user.role}`;
  }

  // ─── Mock notifications (simulates /api/notifications) ──
  fetchNotifications() {
    const role = this.user.role;
    const mock = [];

    if (role === 'superadmin') {
      // Superadmins see nothing (they create, don't receive)
    }
    if (role === 'admin') {
      mock.push({
        id: 1, title: 'System Maintenance', priority: 'high',
        message: 'Database upgrade scheduled for 2 AM tomorrow. Expect 5 min downtime.',
        sender: 'SuperAdmin', time: '2h ago'
      });
    }
    if (role === 'owner') {
      mock.push({
        id: 2, title: 'Subscription Reminder', priority: 'normal',
        message: 'Your free trial ends in 7 days. Subscribe to keep managing tenants.',
        sender: 'Admin', time: '1d ago'
      });
    }
    if (role === 'tenant') {
      mock.push({
        id: 3, title: 'Bill Generated', priority: 'urgent',
        message: 'Your bill for Jestha 2083 is ready. Please pay before the 10th.',
        sender: 'Ram Sharma (Owner)', time: 'Just now'
      });
      mock.push({
        id: 4, title: 'Notice', priority: 'low',
        message: 'Water supply maintenance on Sunday. Store water accordingly.',
        sender: 'Owner', time: '3h ago'
      });
    }

    this.notifications = mock;
    this.renderNotifications();
  }

  // ─── Render sidebar navigation ──
  renderNav() {
    const nav = document.getElementById('sidebarNav');
    const items = this.navConfig[this.user.role] || [];
    let html = `<div class="nav-label">${this.roleMeta[this.user.role].label} Panel</div>`;

    items.forEach((item, i) => {
      if (item.divider) {
        html += `<div class="nav-label" style="margin-top:8px;">────</div>`;
      }
      const active = this.activeNav === item.id ? 'active' : '';
      html += `<a class="nav-item ${active}" data-nav="${item.id}">
        <span class="nav-icon">${item.icon}</span>
        ${item.label}
      </a>`;
    });

    nav.innerHTML = html;

    // Bind click handlers
    nav.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const navId = el.dataset.nav;
        this.navigate(navId);
      });
    });
  }

  // ─── Render notification banners ──
  renderNotifications() {
    const strip = document.getElementById('notifStrip');

    if (!this.notifications.length) {
      strip.innerHTML = '';
      return;
    }

    const priorityIcon = { urgent: '🔴', high: '🟡', normal: '🔵', low: '🟢' };

    strip.innerHTML = this.notifications.map(n => `
      <div class="notif-banner ${n.priority}" data-nid="${n.id}">
        <span class="notif-icon">${priorityIcon[n.priority] || '📌'}</span>
        <div class="notif-body">
          <div class="notif-title">${n.title}</div>
          <div class="notif-msg">${n.message}</div>
          <div class="notif-meta">From ${n.sender} · ${n.time}</div>
        </div>
        <button class="notif-dismiss" onclick="app.dismissNotif(${n.id})">✕</button>
      </div>
    `).join('');
  }

  dismissNotif(id) {
    this.notifications = this.notifications.filter(n => n.id !== id);
    this.renderNotifications();
  }

  // ─── Render page content ──
  renderContent() {
    const container = document.getElementById('pageContent');
    const key = this.user.role;
    container.innerHTML = this.pageContent[key] || `<div class="content-card"><h3>Welcome</h3><p class="placeholder-text">Select a section from the sidebar.</p></div>`;
  }

  // ─── Navigate to a section ──
  navigate(navId) {
    this.activeNav = navId;
    this.renderNav();
    this.renderContent();

    // Update page title
    const items = this.navConfig[this.user.role] || [];
    const found = items.find(i => i.id === navId);
    document.getElementById('pageTitle').textContent = found ? found.label : 'Dashboard';

    // Update timestamp
    this.updateTimestamp();
  }

  // ─── Update header timestamp ──
  updateTimestamp() {
    const now = new Date();
    const opts = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
    document.getElementById('headerTimestamp').textContent = now.toLocaleDateString('en-US', opts);
  }

  // ─── Render user info ──
  renderUser() {
    const meta = this.roleMeta[this.user.role];
    const initial = this.user.fullName.charAt(0).toUpperCase();
    document.getElementById('userAvatar').textContent = initial;
    document.getElementById('userDisplayName').textContent = this.user.fullName;
    document.getElementById('userDisplayRole').textContent = meta.label;
    document.getElementById('headerRoleBadge').textContent = meta.label;
    document.getElementById('headerRoleBadge').style.background = `${meta.color}22`;
    document.getElementById('headerRoleBadge').style.color = meta.color;
  }

  // ─── Full render ──
  render() {
    this.renderUser();
    this.renderNav();
    this.fetchNotifications();
    this.navigate('overview');
  }
}

// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const app = new DashboardApp();

// Role switcher — for demo purposes only (select from URL hash)
const params = new URLSearchParams(window.location.search);
const demoRole = params.get('role') || 'owner';
app.init(demoRole);

// Sidebar mobile toggle
document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
});

// Demo: quick role switch by clicking the role badge
document.getElementById('headerRoleBadge').addEventListener('dblclick', () => {
  const roles = ['superadmin', 'admin', 'owner', 'tenant'];
  const current = app.user.role;
  const next = roles[(roles.indexOf(current) + 1) % roles.length];
  app.init(next);
  // Update URL without reload
  const url = new URL(window.location);
  url.searchParams.set('role', next);
  window.history.replaceState({}, '', url);
});

// Logout placeholder
document.getElementById('logoutBtn').addEventListener('click', () => {
  if (confirm('Sign out of SajiloRent?')) {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/login.html';
  }
});
</script>
