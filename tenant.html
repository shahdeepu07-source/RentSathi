<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentSathi - Tenant Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg:#0b1120; --card:#111827; --text:#f8fafc; --text-muted:#94a3b8; --accent:#2563eb; --accent-hover:#1d4ed8; --success:#10b981; --warn:#f59e0b; --danger:#ef4444; --border:#1f2937; --radius:12px; --shadow:0 4px 24px rgba(0,0,0,0.3); --transition:0.2s ease; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,-apple-system,sans-serif; }
        body { background:var(--bg); color:var(--text); padding:20px; min-height:100vh; }
        .container { max-width:900px; margin:0 auto; }
        header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border); }
        header h1 { font-size:1.6rem; font-weight:700; }
        .user-info { color:var(--text-muted); font-size:0.85rem; margin-right:15px; }
        .btn-logout { background:var(--danger); color:#fff; border:none; padding:5px 15px; border-radius:6px; cursor:pointer; font-size:0.8rem; font-weight:600; transition:var(--transition); }
        .btn-logout:hover { opacity:0.85; transform:translateY(-1px); }
        .card { background:var(--card); padding:20px; border-radius:var(--radius); border:1px solid var(--border); margin-bottom:16px; box-shadow:var(--shadow); }
        .card h3 { font-size:1.1rem; font-weight:600; margin-bottom:12px; }
        table { width:100%; border-collapse:collapse; margin-top:10px; font-size:0.9rem; }
        th, td { padding:10px; text-align:left; border-bottom:1px solid var(--border); }
        th { color:var(--text-muted); font-size:0.7rem; text-transform:uppercase; }
        .badge-paid { background:var(--success); color:#000; padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:600; }
        .badge-unpaid { background:var(--danger); color:#fff; padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:600; }
        .badge-balance-due { background:var(--danger); color:#fff; padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:600; }
        .badge-balance-advance { background:var(--success); color:#000; padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:600; }
        .badge-balance-zero { background:var(--text-muted); color:#fff; padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:600; }
        .amount { font-weight:700; color:var(--success); }
        .btn-download { background:var(--accent); padding:4px 12px; font-size:0.75rem; border:none; border-radius:4px; color:#fff; cursor:pointer; transition:var(--transition); }
        .btn-download:hover { opacity:0.8; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(5px); z-index:100; justify-content:center; align-items:center; }
        .modal-content { background:var(--card); padding:24px; border-radius:var(--radius); width:92%; max-width:560px; max-height:90vh; overflow-y:auto; border:1px solid var(--border); box-shadow:var(--shadow); }
        .modal-content .close { float:right; cursor:pointer; font-size:1.6rem; color:var(--danger); line-height:1; }
        .modal-content .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .modal-content .modal-header h3 { font-weight:600; font-size:1.1rem; }
        .pro-bill { background:#fff; color:#111; padding:35px 40px; border-radius:6px; font-family:'Helvetica Neue',Arial,sans-serif; box-shadow:0 4px 20px rgba(0,0,0,0.15); }
        .pb-head { text-align:center; margin-bottom:28px; padding-bottom:18px; border-bottom:3px solid #000; }
        .pb-head h2 { font-size:2rem; font-weight:800; letter-spacing:3px; margin:0; text-transform:uppercase; }
        .pb-info { display:flex; justify-content:space-between; margin-bottom:24px; font-size:1rem; }
        .pb-info strong { font-weight:700; color:#222; }
        .pb-readings { display:grid; grid-template-columns:1fr 1fr 1fr; gap:25px; margin:30px 0; border-top:2px solid #ddd; border-bottom:2px solid #ddd; padding:22px 0; text-align:center; }
        .pb-reading-label { font-size:0.8rem; color:#666; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        .pb-reading-val { font-size:1.9rem; font-weight:800; }
        .pb-table { width:100%; border-collapse:collapse; margin:20px 0; }
        .pb-table td { padding:12px 0; border-bottom:1px solid #eee; }
        .pb-row-desc { color:#333; font-weight:600; }
        .pb-row-val { text-align:right; font-weight:700; font-family:'Courier New',monospace; font-size:1.05rem; }
        .pb-ded-row { color:#d93025; font-style:italic; }
        .pb-ded-row td { border-bottom:1px dashed #d93025; }
        .pb-total-section { text-align:right; margin:35px 0 10px; }
        .pb-total-label { font-size:0.85rem; color:#555; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
        .pb-total-val { font-size:2.6rem; font-weight:900; color:#000; }
        .pb-note-box { background:#f8fafc; padding:16px; border-left:4px solid var(--accent); margin:20px 0; border-radius:4px; text-align:left; }
        .pb-note-label { font-weight:800; color:#444; font-size:0.85rem; display:block; margin-bottom:5px; text-transform:uppercase; }
        .pb-note-text { font-weight:600; color:#000; font-size:1.05rem; }
        .pb-footer { text-align:center; margin-top:40px; font-size:0.8rem; color:#888; letter-spacing:2px; text-transform:uppercase; }
        .footer-text { text-align:center; color:var(--text-muted); font-size:0.75rem; margin-top:30px; padding-top:16px; border-top:1px solid var(--border); }
        .header-links { display:flex; align-items:center; gap:12px; }
        .header-links a { color:var(--accent); text-decoration:none; font-size:0.85rem; transition:var(--transition); }
        .header-links a:hover { text-decoration:underline; }
        @media(max-width:480px){ .modal-content { padding:16px; } .pro-bill { padding:20px; } }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <h1>📋 RentSathi</h1>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <span class="user-info" id="userDisplay">tenant</span>
            <div class="header-links">
                <a href="https://chat.whatsapp.com/GGdhMRIhTFUH9AxnUfap2b" target="_blank" class="help-link">💬 Help</a>
            </div>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>
    </header>

    <!-- BALANCE CARD -->
    <div class="card">
        <h3>💰 Your Balance</h3>
        <div id="balanceDisplay" style="font-size:1.4rem; font-weight:700; padding:8px 0;">
            Loading...
        </div>
    </div>

    <!-- CURRENT BILL -->
    <div class="card">
        <h3>📄 Current Bill</h3>
        <div id="currentBill">
            <p style="color:var(--text-muted);">Loading...</p>
        </div>
    </div>

    <!-- HISTORY -->
    <div class="card">
        <h3>📜 Bill History</h3>
        <table>
            <thead><tr><th>Month</th><th>Units</th><th>Total</th><th>Status</th><th>Payment</th><th>Download</th></tr></thead>
            <tbody id="historyTable">
                <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No bills yet</td></tr>
            </tbody>
        </table>
    </div>

    <!-- FOOTER -->
    <div class="footer-text">
        Created by Gnomon Studio • © 2026 RentSathi
    </div>
</div>

<!-- BILL MODAL -->
<div id="billModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Bill Preview</h3>
            <span class="close" onclick="closeBillModal()">×</span>
        </div>
        <div id="printArea" class="pro-bill"></div>
        <div style="margin-top:16px; display:flex; gap:10px;">
            <button onclick="downloadBillImage()" style="flex:1; background:var(--success); border:none; padding:10px; border-radius:6px; color:#000; font-weight:600; cursor:pointer;">📸 Download Image</button>
            <button onclick="closeBillModal()" style="flex:1; background:var(--danger); border:none; padding:10px; border-radius:6px; color:#fff; font-weight:600; cursor:pointer;">Close</button>
        </div>
    </div>
</div>

<script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // AUTHENTICATION & ROLE CHECK
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const API_BASE = '/api';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';
    const userStr = localStorage.getItem('user');
    let user = null;
    try { user = JSON.parse(userStr); } catch(e) {}
    if (!user || user.role !== 'tenant') {
        localStorage.removeItem('token'); localStorage.removeItem('user');
        window.location.href = '/login.html';
    }
    let authToken = token;

    function logout() {
        localStorage.removeItem('token'); localStorage.removeItem('user');
        window.location.href = '/login.html';
    }
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('userDisplay').textContent = user.username;

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // API HELPER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function api(method, url, data) {
        const opts = {
            method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            }
        };
        if (data) opts.body = JSON.stringify(data);
        const res = await fetch(`${API_BASE}${url}`, opts);
        if (!res.ok) {
            if (res.status === 401) { logout(); throw new Error('Session expired'); }
            const err = await res.text();
            throw new Error(err || 'Request failed');
        }
        return res.json();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // LOAD TENANT DATA
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    let currentBills = [];
    let currentTenant = null;
    let currentHouse = '';

    async function loadTenantData() {
        try {
            const data = await api('GET', '/tenant/bills');
            const { bills, tenant, house } = data;

            currentBills = bills || [];
            currentTenant = tenant;
            currentHouse = house || '';

            // If no tenant linked, show message
            if (!tenant) {
                document.getElementById('balanceDisplay').innerHTML = `<span style="color:var(--text-muted);">No tenant account linked yet. Contact your property owner.</span>`;
                document.getElementById('currentBill').innerHTML = `<p style="color:var(--text-muted);">No bills found.</p>`;
                document.getElementById('historyTable').innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No bills yet</td></tr>`;
                return;
            }

            // Update balance display
            renderBalance(tenant);

            // Current bill (latest)
            if (bills.length > 0) {
                const current = bills[0];
                renderCurrentBill(current);
                renderHistory(bills);
            } else {
                document.getElementById('currentBill').innerHTML = `<p style="color:var(--text-muted);">No bills generated yet.</p>`;
                document.getElementById('historyTable').innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No bills yet</td></tr>`;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('balanceDisplay').innerHTML = `<span style="color:var(--danger);">Error loading balance</span>`;
            document.getElementById('currentBill').innerHTML = `<p style="color:var(--danger);">Error loading bills</p>`;
        }
    }

    // ─── Balance ──────────────────────────────────────────────
    function renderBalance(tenant) {
        const balance = tenant.balance || 0;
        let html = '';
        let badgeClass = 'badge-balance-zero';
        let label = 'Zero Balance';

        if (balance > 0) {
            badgeClass = 'badge-balance-due';
            label = `Due Amount: Rs. ${balance.toLocaleString()}`;
            html = `<span class="${badgeClass}" style="font-size:1.2rem; padding:6px 16px;">🔴 ${label}</span>`;
        } else if (balance < 0) {
            badgeClass = 'badge-balance-advance';
            label = `Advance Balance: Rs. ${Math.abs(balance).toLocaleString()}`;
            html = `<span class="${badgeClass}" style="font-size:1.2rem; padding:6px 16px;">🟢 ${label}</span>`;
        } else {
            html = `<span class="${badgeClass}" style="font-size:1.2rem; padding:6px 16px;">✅ ${label}</span>`;
        }
        document.getElementById('balanceDisplay').innerHTML = html;
    }

    // ─── Current Bill ──────────────────────────────────────────
    function renderCurrentBill(bill) {
        const paidStatus = bill.paid_status ? 'Paid' : 'Unpaid';
        const statusBadge = bill.paid_status ? 'badge-paid' : 'badge-unpaid';
        const paymentInfo = bill.payment_type ? `<div style="font-size:0.85rem; color:var(--text-muted); margin-top:6px;">Payment: ${bill.payment_type} ${bill.payment_amount ? '(Rs. '+bill.payment_amount+')' : ''} ${bill.payment_reason ? '- '+bill.payment_reason : ''}</div>` : '';

        document.getElementById('currentBill').innerHTML = `
            <div style="background:#0f172a; padding:16px; border-radius:8px; border-left:4px solid ${bill.paid_status ? 'var(--success)' : 'var(--danger)'};">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; align-items:center; gap:8px;">
                    <div>
                        <span style="font-weight:600;">House:</span> ${currentHouse}
                        <span style="margin-left:16px; font-weight:600;">Month:</span> ${bill.month}
                    </div>
                    <div>
                        <span style="font-weight:700; font-size:1.2rem; color:var(--success);">Rs. ${Number(bill.total).toLocaleString()}</span>
                        <span class="${statusBadge}" style="margin-left:12px;">${paidStatus}</span>
                    </div>
                </div>
                <div style="margin-top:8px; font-size:0.9rem; color:var(--text-muted);">
                    Units: ${bill.units} | Electricity: Rs. ${bill.electricity}
                </div>
                ${paymentInfo}
                ${bill.note ? `<div style="margin-top:6px; font-size:0.85rem; color:var(--warn);">📌 ${bill.note}</div>` : ''}
                <button class="btn-download" onclick="showBillModalForTenant(${JSON.stringify(bill).replace(/"/g,'&quot;')}, '${currentHouse}')" style="margin-top:10px;">📷 Download Bill</button>
            </div>
        `;
    }

    // ─── History ──────────────────────────────────────────────
    function renderHistory(bills) {
        const tbody = document.getElementById('historyTable');
        tbody.innerHTML = bills.map(b => {
            const statusBadge = b.paid_status ? 'badge-paid' : 'badge-unpaid';
            const statusText = b.paid_status ? 'Paid' : 'Unpaid';
            const paymentInfo = b.payment_type ? `${b.payment_type}${b.payment_amount ? ' (Rs. '+b.payment_amount+')' : ''}` : '—';
            return `
                <tr>
                    <td>${b.month}</td>
                    <td>${b.units}</td>
                    <td>Rs. ${Number(b.total).toLocaleString()}</td>
                    <td><span class="${statusBadge}">${statusText}</span></td>
                    <td style="font-size:0.8rem; color:var(--text-muted);">${paymentInfo}</td>
                    <td><button class="btn-download" onclick="showBillModalForTenant(${JSON.stringify(b).replace(/"/g,'&quot;')}, '${currentHouse}')">📷</button></td>
                </tr>
            `;
        }).join('');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // BILL MODAL
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    let currentBillForModal = null;

    window.showBillModalForTenant = function(bill, house) {
        currentBillForModal = { ...bill, house };
        document.getElementById('billModal').style.display = 'flex';
        const noteHtml = bill.note ? `<div class="pb-note-box"><span class="pb-note-label">⚠️ NOTICE</span><span class="pb-note-text">${bill.note}</span></div>` : '';
        const dedHtml = bill.ded > 0 ? `<tr class="pb-ded-row"><td class="pb-row-desc">Deduction (${bill.dedReason || 'Applied'})</td><td class="pb-row-val">- Rs. ${Number(bill.ded).toLocaleString()}</td></tr>` : '';
        // Add payment info if available
        const paymentInfo = bill.payment_type ? `<tr><td class="pb-row-desc">Payment Type</td><td class="pb-row-val">${bill.payment_type} ${bill.payment_amount ? '(Rs. '+bill.payment_amount+')' : ''}</td></tr>` : '';
        const paymentReason = bill.payment_reason ? `<tr><td class="pb-row-desc">Remarks</td><td class="pb-row-val">${bill.payment_reason}</td></tr>` : '';

        document.getElementById('printArea').innerHTML = `
            <div class="pb-head"><h2>MONTHLY BILL</h2></div>
            <div class="pb-info"><div><strong>Tenant:</strong> ${bill.name}</div><div><strong>Month:</strong> ${bill.month}</div></div>
            <div class="pb-readings"><div><div class="pb-reading-label">Previous</div><div class="pb-reading-val">${bill.prev}</div></div><div><div class="pb-reading-label">Current</div><div class="pb-reading-val">${bill.curr}</div></div><div><div class="pb-reading-label">Units</div><div class="pb-reading-val">${bill.units}</div></div></div>
            <table class="pb-table">
                <tr><td class="pb-row-desc">Electricity (${bill.units} units × 15)</td><td class="pb-row-val">Rs. ${Number(bill.electricity).toLocaleString()}</td></tr>
                <tr><td class="pb-row-desc">Room Rent</td><td class="pb-row-val">Rs. ${Number(bill.rent).toLocaleString()}</td></tr>
                <tr><td class="pb-row-desc">Water Unit Charge</td><td class="pb-row-val">Rs. ${Number(bill.water).toLocaleString()}</td></tr>
                <tr><td class="pb-row-desc">Waste Charge</td><td class="pb-row-val">Rs. ${Number(bill.waste).toLocaleString()}</td></tr>
                <tr><td class="pb-row-desc">Previous Due</td><td class="pb-row-val">Rs. ${Number(bill.due).toLocaleString()}</td></tr>
                ${dedHtml}
                ${paymentInfo}
                ${paymentReason}
            </table>
            ${noteHtml}
            <div class="pb-total-section"><div class="pb-total-label">GRAND TOTAL</div><div class="pb-total-val">Rs. ${Number(bill.total).toLocaleString()}</div></div>
            <div class="pb-footer">RentSathi • Pay on time</div>
        `;
    };

    window.closeBillModal = function() {
        document.getElementById('billModal').style.display = 'none';
    };

    window.downloadBillImage = function() {
        const el = document.getElementById('printArea');
        const month = currentBillForModal?.month?.replace(/\s+/g, '_') || 'Statement';
        html2canvas(el, { scale: 3, backgroundColor: '#ffffff', logging: false }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Bill_${month}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    };

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    loadTenantData();
</script>
</body>
</html>
