<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SajiloRent – Tenant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root { --bg:#0b1120; --card:#111827; --text:#f8fafc; --text-2:#cbd5e1; --text-muted:#94a3b8; --accent:#2563eb; --accent-hover:#1d4ed8; --success:#10b981; --warn:#f59e0b; --danger:#ef4444; --info:#06b6d4; --border:#1f2937; --radius:12px; --shadow:0 4px 24px rgba(0,0,0,0.3); --transition:0.2s ease; --danger-bg:rgba(239,68,68,0.12); --warn-bg:rgba(245,158,11,0.12); --info-bg:rgba(6,182,212,0.12); --sidebar-w:220px; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,-apple-system,sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

    /* ─── SIDEBAR ─── */
    .sidebar { width:var(--sidebar-w); background:var(--card); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh; z-index:100; padding:20px 0; }
    .sidebar-brand { display:flex; align-items:center; gap:10px; padding:0 20px 20px; border-bottom:1px solid var(--border); margin-bottom:12px; }
    .sidebar-brand img { height:28px; width:auto; }
    .sidebar-brand span { font-size:1.1rem; font-weight:700; background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .sidebar-nav { flex:1; display:flex; flex-direction:column; gap:2px; padding:0 10px; }
    .sidebar-nav a { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px; color:var(--text-muted); text-decoration:none; font-size:0.85rem; font-weight:500; transition:var(--transition); cursor:pointer; }
    .sidebar-nav a:hover { background:var(--bg); color:var(--text); }
    .sidebar-nav a.active { background:var(--accent); color:#fff; }
    .sidebar-footer { padding:16px 20px 0; border-top:1px solid var(--border); margin-top:auto; }
    .sidebar-footer .user-name { font-size:0.8rem; color:var(--text); }
    .sidebar-footer .user-role { font-size:0.68rem; color:var(--text-muted); }
    .sidebar-footer .logout-link { display:block; margin-top:8px; font-size:0.78rem; color:var(--danger); cursor:pointer; }

    /* ─── MAIN ─── */
    .main { margin-left:var(--sidebar-w); flex:1; padding:24px 32px; min-height:100vh; }
    .main-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:8px; }
    .main-header h1 { font-size:1.4rem; font-weight:700; }
    .main-header .sub { font-size:0.78rem; color:var(--text-muted); }

    /* ─── TAB PANEL ─── */
    .tab-panel { display:none; animation:fadeIn 0.25s ease; }
    .tab-panel.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    /* ─── STATS CARDS ─── */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:16px; margin-bottom:28px; }
    .stat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); }
    .stat-card .label { font-size:0.7rem; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.5px; }
    .stat-card .value { font-size:2rem; font-weight:700; margin-top:4px; }
    .stat-card .value.green { color:var(--success); }
    .stat-card .value.red { color:var(--danger); }
    .stat-card .value.yellow { color:var(--warn); }
    .stat-card .value.blue { color:var(--accent); }

    /* ─── SECTION CARDS ─── */
    .section-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:24px; }
    .section-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
    .section-header h3 { font-size:1.1rem; font-weight:600; }

    /* ─── TABLES ─── */
    .table-wrapper { overflow-x:auto; border:1px solid var(--border); border-radius:8px; }
    table { width:100%; border-collapse:collapse; font-size:0.9rem; }
    th { text-align:left; padding:10px 14px; color:var(--text-muted); font-weight:600; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid var(--border); background:#0f172a; }
    td { padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(37,99,235,0.03); }

    /* ─── BADGES ─── */
    .badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:0.65rem; font-weight:600; text-transform:uppercase; letter-spacing:0.3px; }
    .badge-paid { background:var(--success); color:#000; }
    .badge-unpaid { background:var(--danger); color:#fff; }
    .badge-balance-due { background:var(--danger); color:#fff; }
    .badge-balance-advance { background:var(--success); color:#000; }
    .badge-balance-zero { background:var(--text-muted); color:#fff; }

    /* ─── BUTTONS ─── */
    .btn-primary { background:var(--accent); color:#fff; border:none; padding:8px 18px; border-radius:6px; font-weight:600; font-size:0.85rem; cursor:pointer; transition:var(--transition); }
    .btn-primary:hover { background:var(--accent-hover); transform:translateY(-1px); }
    .btn-success { background:var(--success); color:#fff; border:none; padding:8px 18px; border-radius:6px; font-weight:600; font-size:0.85rem; cursor:pointer; transition:var(--transition); }
    .btn-success:hover { opacity:0.85; transform:translateY(-1px); }
    .btn-outline { background:transparent; color:var(--text); border:1px solid var(--border); padding:8px 18px; border-radius:6px; font-weight:600; font-size:0.85rem; cursor:pointer; transition:var(--transition); }
    .btn-outline:hover { border-color:var(--text-muted); }
    .btn-sm { padding:5px 12px; font-size:0.75rem; }

    /* ─── NOTIFICATION BANNERS ─── */
    .notif-strip { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
    .notif-banner { display:flex; align-items:flex-start; gap:12px; padding:10px 14px; border-radius:8px; border-left:4px solid var(--info); background:#1a2332; font-size:0.85rem; animation:notifIn 0.3s ease; }
    .notif-banner.urgent { border-left-color:var(--danger); background:var(--danger-bg); }
    .notif-banner.high   { border-left-color:var(--warn);   background:var(--warn-bg); }
    .notif-banner.normal { border-left-color:var(--info);   background:var(--info-bg); }
    .notif-banner.low    { border-left-color:var(--text-muted); background:var(--surface-2); }
    .notif-banner .nf-icon { font-size:1.1rem; flex-shrink:0; margin-top:1px; }
    .notif-banner .nf-body { flex:1; min-width:0; }
    .notif-banner .nf-title { font-weight:600; font-size:0.88rem; }
    .notif-banner .nf-msg   { color:var(--text-2); margin-top:2px; font-size:0.82rem; }
    .notif-banner .nf-meta  { font-size:0.68rem; color:var(--text-muted); margin-top:4px; }
    .notif-banner .nf-dismiss { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1rem; padding:2px; line-height:1; transition:color 0.2s; }
    .notif-banner .nf-dismiss:hover { color:var(--text); }
    @keyframes notifIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

    /* ─── CURRENT BILL ─── */
    .current-bill-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
    .current-bill-row { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    .current-bill-detail { font-size:0.85rem; color:var(--text-2); margin-top:6px; }

    /* ─── BILL MODAL ─── */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(5px); z-index:200; justify-content:center; align-items:center; }
    .modal-content { background:var(--card); padding:24px; border-radius:var(--radius); width:92%; max-width:560px; max-height:90vh; overflow-y:auto; border:1px solid var(--border); box-shadow:var(--shadow); }
    .modal-content .close { float:right; cursor:pointer; font-size:1.6rem; color:var(--danger); line-height:1; }
    .modal-content .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .modal-content .modal-header h3 { font-weight:600; font-size:1.1rem; }
    .pro-bill { background:#fff; color:#111; padding:35px 40px; border-radius:6px; font-family:'Helvetica Neue',Arial,sans-serif; box-shadow:0 4px 20px rgba(0,0,0,0.15); }
    .pb-head { text-align:center; margin-bottom:28px; padding-bottom:18px; border-bottom:3px solid #000; }
    .pb-head h2 { font-size:2rem; font-weight:800; letter-spacing:3px; margin:0; text-transform:uppercase; }
    .pb-info { display:flex; justify-content:space-between; margin-bottom:24px; font-size:1rem; }
    .pb-info strong { font-weight:700; color:#222; }
    .pb-readings { display:grid; grid-template-columns:1fr 1fr 1fr; gap:25px; margin:30px 0; border-top:2px solid #ddd; border-bottom:2px solid #ddd; padding:22px 0; text-align:center; }
    .pb-reading-label { font-size:0.8rem; color:#666; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .pb-reading-val { font-size:1.9rem; font-weight:800; }
    .pb-table-modal { width:100%; border-collapse:collapse; margin:20px 0; }
    .pb-table-modal td { padding:12px 0; border-bottom:1px solid #eee; }
    .pb-row-desc { color:#333; font-weight:600; }
    .pb-row-val { text-align:right; font-weight:700; font-family:'Courier New',monospace; font-size:1.05rem; }
    .pb-ded-row { color:#d93025; font-style:italic; }
    .pb-ded-row td { border-bottom:1px dashed #d93025; }
    .pb-total-section { text-align:right; margin:35px 0 10px; }
    .pb-total-label { font-size:0.85rem; color:#555; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
    .pb-total-val { font-size:2.6rem; font-weight:900; color:#000; }
    .pb-note-box { background:#f8fafc; padding:16px; border-left:4px solid var(--accent); margin:20px 0; border-radius:4px; text-align:left; }
    .pb-note-label { font-weight:800; color:#444; font-size:0.85rem; display:block; margin-bottom:5px; text-transform:uppercase; }
    .pb-note-text { font-weight:600; color:#000; font-size:1.05rem; }
    .pb-footer { text-align:center; margin-top:40px; font-size:0.8rem; color:#888; letter-spacing:2px; text-transform:uppercase; }

    /* ─── MADE BY KALI ─── */
    .made-by-kali { position:fixed; bottom:12px; right:16px; z-index:999; display:flex; align-items:center; gap:6px; color:#6b7280; font-size:0.7rem; font-family:'SF Mono','Fira Code','Cascadia Code',monospace; letter-spacing:0.8px; opacity:0.5; transition:opacity 0.3s; pointer-events:none; }
    .made-by-kali span { color:var(--accent); font-weight:600; opacity:0.85; }

    @media(max-width:768px) { .sidebar { width:56px; } .sidebar-brand span, .sidebar-nav a span, .sidebar-footer .user-name, .sidebar-footer .user-role, .sidebar-footer .logout-link { display:none; } .sidebar-nav a { justify-content:center; padding:10px; } .sidebar-brand { justify-content:center; padding:0 10px 16px; } .main { margin-left:56px; padding:16px; } }
  </style>
</head>
<body>

<!-- ─── SIDEBAR ─── -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <span>SajiloRent</span>
  </div>
  <nav class="sidebar-nav">
    <a class="active" data-tab="tab-dashboard" onclick="switchTab('tab-dashboard')">📊 Dashboard</a>
    <a data-tab="tab-history" onclick="switchTab('tab-history')">📜 Bills</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-name" id="userName">tenant</div>
    <div class="user-role">Tenant</div>
    <div class="logout-link" onclick="logout()">Logout</div>
  </div>
</aside>

<!-- ─── MAIN ─── -->
<section class="main">

  <!-- Notification Banners -->
  <div class="notif-strip" id="notifStrip"></div>

  <!-- ─── TAB: DASHBOARD ─── -->
  <div id="tab-dashboard" class="tab-panel active">

    <div class="main-header">
      <div>
        <h1>Dashboard</h1>
        <div class="sub" id="houseDisplay"></div>
      </div>
    </div>

    <!-- Balance Card -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Your Balance</div>
        <div class="value" id="balanceValue">—</div>
      </div>
    </div>

    <!-- Current Bill -->
    <div class="section-card">
      <div class="section-header"><h3>Current Bill</h3></div>
      <div id="currentBill">
        <p style="color:var(--text-muted);font-size:0.9rem;">Loading…</p>
      </div>
    </div>

  </div>

  <!-- ─── TAB: BILLS ─── -->
  <div id="tab-history" class="tab-panel">

    <div class="main-header">
      <div>
        <h1>Bill History</h1>
        <div class="sub">Complete payment record</div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header"><h3>All Bills</h3></div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Month</th><th>Units</th><th>Total</th><th>Status</th><th>Payment</th><th>Bill</th></tr></thead>
          <tbody id="historyTable">
            <tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No bills yet</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

</section>

<div class="made-by-kali">made by <span>kali</span></div>

<!-- ─── BILL MODAL ─── -->
<div id="billModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Bill Preview</h3>
      <span class="close" onclick="closeBillModal()">×</span>
    </div>
    <div id="printArea" class="pro-bill"></div>
    <div style="margin-top:16px; display:flex; gap:10px;">
      <button onclick="downloadBillImage()" class="btn-success" style="flex:1;">📸 Download Image</button>
      <button onclick="closeBillModal()" class="btn-outline" style="flex:1;">Close</button>
    </div>
  </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// AUTH
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const API_BASE = '/api';
const token = localStorage.getItem('token');
if (!token) window.location.href = '/login.html';
const userStr = localStorage.getItem('user');
let user = null;
try { user = JSON.parse(userStr); } catch(e) {}
if (!user || user.role !== 'tenant') {
  localStorage.removeItem('token'); localStorage.removeItem('user');
  window.location.href = '/login.html';
}
let authToken = token;
document.getElementById('userName').textContent = user.username || 'tenant';

function logout() {
  localStorage.removeItem('token'); localStorage.removeItem('user');
  window.location.href = '/login.html';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TAB SWITCHING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function switchTab(tabId) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
  document.querySelector(`.sidebar-nav a[data-tab="${tabId}"]`).classList.add('active');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// API HELPER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function api(method, url, data) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${authToken}`
    }
  };
  if (data) opts.body = JSON.stringify(data);
  const res = await fetch(`${API_BASE}${url}`, opts);
  if (!res.ok) {
    if (res.status === 401) { logout(); throw new Error('Session expired'); }
    const err = await res.text();
    throw new Error(err || 'Request failed');
  }
  return res.json();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// NOTIFICATIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function loadNotifications() {
  try {
    const notifs = await api('GET', '/notifications');
    const strip = document.getElementById('notifStrip');
    if (!notifs || notifs.length === 0) {
      strip.innerHTML = '';
      return;
    }
    const priorityIcon = { urgent:'🔴', high:'🟡', normal:'🔵', low:'🟢' };
    strip.innerHTML = notifs.map(n => `
      <div class="notif-banner ${n.priority || 'normal'}">
        <span class="nf-icon">${priorityIcon[n.priority] || '📌'}</span>
        <div class="nf-body">
          <div class="nf-title">${escHtml(n.title)}</div>
          <div class="nf-msg">${escHtml(n.message)}</div>
          <div class="nf-meta">From ${escHtml(n.sender_name)}</div>
        </div>
        <button class="nf-dismiss" onclick="dismissNotif(${n.id})">✕</button>
      </div>
    `).join('');
  } catch (e) { console.error('Failed to load notices:', e); }
}

window.dismissNotif = async function(id) {
  try {
    await api('PATCH', `/notifications/${id}/dismiss`);
    await loadNotifications();
  } catch (e) { console.error('Failed to dismiss notice:', e); }
};

function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TENANT DATA
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let currentBills = [];
let currentTenant = null;
let currentHouse = '';

async function loadTenantData() {
  try {
    const data = await api('GET', '/tenant/bills');
    const { bills, tenant, house } = data;
    currentBills = bills || [];
    currentTenant = tenant;
    currentHouse = house || '';
    document.getElementById('houseDisplay').textContent = house ? `House: ${house}` : '';

    if (!tenant) {
      document.getElementById('balanceValue').innerHTML = '<span style="font-size:0.9rem;color:var(--text-muted);">Not linked. Contact owner.</span>';
      document.getElementById('currentBill').innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">No bills found.</p>';
      document.getElementById('historyTable').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No bills yet</td></tr>';
      return;
    }

    renderBalance(tenant);
    if (bills.length > 0) {
      renderCurrentBill(bills[0]);
      renderHistory(bills);
    } else {
      document.getElementById('currentBill').innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">No bills generated yet.</p>';
      document.getElementById('historyTable').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">No bills yet</td></tr>';
    }
  } catch (err) {
    console.error(err);
    document.getElementById('balanceValue').innerHTML = '<span style="color:var(--danger);font-size:0.9rem;">Error</span>';
    document.getElementById('currentBill').innerHTML = '<p style="color:var(--danger);">Error loading bills</p>';
  }
}

function renderBalance(tenant) {
  const balance = tenant.balance || 0;
  let badgeClass = 'badge-balance-zero';
  let label = 'Zero Balance';
  let prefix = '✅';
  if (balance > 0) {
    badgeClass = 'badge-balance-due';
    label = `Rs. ${balance.toLocaleString()} Due`;
    prefix = '🔴';
  } else if (balance < 0) {
    badgeClass = 'badge-balance-advance';
    label = `Rs. ${Math.abs(balance).toLocaleString()} Advance`;
    prefix = '🟢';
  } else {
    label = 'Clear';
    prefix = '✅';
  }
  document.getElementById('balanceValue').innerHTML = `<span class="badge ${badgeClass}" style="font-size:1rem;">${prefix} ${label}</span>`;
}

function renderCurrentBill(bill) {
  const paid = bill.paid_status;
  document.getElementById('currentBill').innerHTML = `
    <div class="current-bill-card" style="border-left:4px solid ${paid ? 'var(--success)' : 'var(--danger)'};">
      <div class="current-bill-row">
        <div>
          <strong>Month:</strong> ${bill.month}
        </div>
        <div>
          <span style="font-weight:700;font-size:1.2rem;color:var(--success);">Rs. ${Number(bill.total).toLocaleString()}</span>
          <span class="badge ${paid ? 'badge-paid' : 'badge-unpaid'}" style="margin-left:10px;">${paid ? 'Paid' : 'Unpaid'}</span>
        </div>
      </div>
      <div class="current-bill-detail">
        Units: ${bill.units} &nbsp;|&nbsp; Electricity: Rs. ${bill.electricity}
        ${bill.payment_type ? `&nbsp;|&nbsp; Payment: ${bill.payment_type}${bill.payment_amount ? ' (Rs. '+bill.payment_amount+')' : ''}` : ''}
      </div>
      ${bill.note ? `<div style="margin-top:8px;font-size:0.85rem;color:var(--warn);">📌 ${bill.note}</div>` : ''}
      <div style="margin-top:12px;">
        <button class="btn-primary btn-sm" onclick="showBillModalForTenant(${JSON.stringify(bill).replace(/"/g,'&quot;')}, '${currentHouse}')">📷 Download Bill</button>
      </div>
    </div>
  `;
}

function renderHistory(bills) {
  const tbody = document.getElementById('historyTable');
  tbody.innerHTML = bills.map(b => {
    const statusBadge = b.paid_status ? 'badge-paid' : 'badge-unpaid';
    const statusText = b.paid_status ? 'Paid' : 'Unpaid';
    const paymentInfo = b.payment_type ? `${b.payment_type}${b.payment_amount ? ' (Rs. '+b.payment_amount+')' : ''}` : '—';
    return `
      <tr>
        <td>${b.month}</td>
        <td>${b.units}</td>
        <td>Rs. ${Number(b.total).toLocaleString()}</td>
        <td><span class="badge ${statusBadge}">${statusText}</span></td>
        <td style="font-size:0.8rem;color:var(--text-muted);">${paymentInfo}</td>
        <td><button class="btn-primary btn-sm" onclick="showBillModalForTenant(${JSON.stringify(b).replace(/"/g,'&quot;')}, '${currentHouse}')">📷</button></td>
      </tr>
    `;
  }).join('');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BILL MODAL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let currentBillForModal = null;

window.showBillModalForTenant = function(bill, house) {
  currentBillForModal = { ...bill, house };
  document.getElementById('billModal').style.display = 'flex';
  const noteHtml = bill.note ? `<div class="pb-note-box"><span class="pb-note-label">⚠️ NOTICE</span><span class="pb-note-text">${bill.note}</span></div>` : '';
  const dedHtml = bill.ded > 0 ? `<tr class="pb-ded-row"><td class="pb-row-desc">Deduction (${bill.dedReason || 'Applied'})</td><td class="pb-row-val">- Rs. ${Number(bill.ded).toLocaleString()}</td></tr>` : '';
  const paymentInfo = bill.payment_type ? `<tr><td class="pb-row-desc">Payment Type</td><td class="pb-row-val">${bill.payment_type} ${bill.payment_amount ? '(Rs. '+bill.payment_amount+')' : ''}</td></tr>` : '';
  const paymentReason = bill.payment_reason ? `<tr><td class="pb-row-desc">Remarks</td><td class="pb-row-val">${bill.payment_reason}</td></tr>` : '';

  document.getElementById('printArea').innerHTML = `
    <div class="pb-head"><h2>MONTHLY BILL</h2></div>
    <div class="pb-info"><div><strong>Tenant:</strong> ${bill.name}</div><div><strong>Month:</strong> ${bill.month}</div></div>
    <div class="pb-readings"><div><div class="pb-reading-label">Previous</div><div class="pb-reading-val">${bill.prev}</div></div><div><div class="pb-reading-label">Current</div><div class="pb-reading-val">${bill.curr}</div></div><div><div class="pb-reading-label">Units</div><div class="pb-reading-val">${bill.units}</div></div></div>
    <table class="pb-table-modal">
      <tr><td class="pb-row-desc">Electricity (${bill.units} units × 15)</td><td class="pb-row-val">Rs. ${Number(bill.electricity).toLocaleString()}</td></tr>
      <tr><td class="pb-row-desc">Room Rent</td><td class="pb-row-val">Rs. ${Number(bill.rent).toLocaleString()}</td></tr>
      <tr><td class="pb-row-desc">Water Unit Charge</td><td class="pb-row-val">Rs. ${Number(bill.water).toLocaleString()}</td></tr>
      <tr><td class="pb-row-desc">Waste Charge</td><td class="pb-row-val">Rs. ${Number(bill.waste).toLocaleString()}</td></tr>
      <tr><td class="pb-row-desc">Previous Due</td><td class="pb-row-val">Rs. ${Number(bill.due).toLocaleString()}</td></tr>
      ${dedHtml}
      ${paymentInfo}
      ${paymentReason}
    </table>
    ${noteHtml}
    <div class="pb-total-section"><div class="pb-total-label">GRAND TOTAL</div><div class="pb-total-val">Rs. ${Number(bill.total).toLocaleString()}</div></div>
    <div class="pb-footer">SajiloRent &bull; Pay on time</div>
  `;
};

window.closeBillModal = function() {
  document.getElementById('billModal').style.display = 'none';
};

window.downloadBillImage = function() {
  const el = document.getElementById('printArea');
  const month = currentBillForModal?.month?.replace(/\s+/g, '_') || 'Statement';
  html2canvas(el, { scale: 3, backgroundColor: '#ffffff', logging: false }).then(canvas => {
    const link = document.createElement('a');
    link.download = `Bill_${month}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
};
