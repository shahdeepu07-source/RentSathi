<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentSathi - Tenant Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root { --bg:#0b1120; --card:#111827; --text:#f8fafc; --accent:#2563eb; --success:#10b981; --warn:#f59e0b; --danger:#ef4444; --border:#1f2937; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',system-ui,sans-serif; }
    body { background:var(--bg); color:var(--text); padding:20px; min-height:100vh; }
    .container { max-width:900px; margin:0 auto; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px; }
    h1 { font-size:1.6rem; font-weight:700; }
    .card { background:var(--card); padding:20px; border-radius:12px; border:1px solid var(--border); margin-bottom:16px; }
    .card h3 { margin-bottom:12px; font-size:1.1rem; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:0.9rem; }
    th, td { padding:10px; text-align:left; border-bottom:1px solid var(--border); }
    th { color:#94a3b8; font-size:0.7rem; text-transform:uppercase; }
    .badge-paid { background:var(--success); color:#000; padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:600; }
    .badge-unpaid { background:var(--danger); color:#fff; padding:2px 8px; border-radius:12px; font-size:0.7rem; font-weight:600; }
    .amount { font-weight:700; color:var(--success); }
    .btn-logout { background:var(--danger); padding:5px 15px; font-size:0.8rem; cursor:pointer; border:none; border-radius:7px; color:#fff; }
    .user-info { color:#94a3b8; font-size:0.85rem; margin-right:15px; }
    .btn-download { background:var(--accent); padding:4px 12px; font-size:0.75rem; border:none; border-radius:4px; color:#fff; cursor:pointer; }
    .btn-download:hover { opacity:0.8; }
    .hidden { display:none; }

    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:100; backdrop-filter:blur(5px); }
    .modal-content { background:var(--card); padding:20px; border-radius:14px; width:92%; max-width:620px; max-height:90vh; overflow-y:auto; border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,0.5); }
    .close { float:right; cursor:pointer; font-size:1.6rem; color:var(--danger); line-height:1; }

    .pro-bill { background:#fff; color:#111; padding:35px 40px; border-radius:6px; font-family:'Helvetica Neue',Arial,sans-serif; box-shadow:0 4px 20px rgba(0,0,0,0.15); }
    .pb-head { text-align:center; margin-bottom:28px; padding-bottom:18px; border-bottom:3px solid #000; }
    .pb-head h2 { font-size:2rem; font-weight:800; letter-spacing:3px; margin:0; text-transform:uppercase; }
    .pb-info { display:flex; justify-content:space-between; margin-bottom:24px; font-size:1rem; }
    .pb-info strong { font-weight:700; color:#222; }
    .pb-readings { display:grid; grid-template-columns:1fr 1fr 1fr; gap:25px; margin:30px 0; border-top:2px solid #ddd; border-bottom:2px solid #ddd; padding:22px 0; text-align:center; }
    .pb-reading-label { font-size:0.8rem; color:#666; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .pb-reading-val { font-size:1.9rem; font-weight:800; }
    .pb-table { width:100%; border-collapse:collapse; margin:20px 0; }
    .pb-table td { padding:12px 0; border-bottom:1px solid #eee; }
    .pb-row-desc { color:#333; font-weight:600; }
    .pb-row-val { text-align:right; font-weight:700; font-family:'Courier New',monospace; font-size:1.05rem; }
    .pb-ded-row { color:#d93025; font-style:italic; }
    .pb-ded-row td { border-bottom:1px dashed #d93025; }
    .pb-total-section { text-align:right; margin:35px 0 10px; }
    .pb-total-label { font-size:0.85rem; color:#555; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
    .pb-total-val { font-size:2.6rem; font-weight:900; color:#000; }
    .pb-note-box { background:#f8fafc; padding:16px; border-left:4px solid var(--accent); margin:20px 0; border-radius:4px; text-align:left; }
    .pb-note-label { font-weight:800; color:#444; font-size:0.85rem; display:block; margin-bottom:5px; text-transform:uppercase; }
    .pb-note-text { font-weight:600; color:#000; font-size:1.05rem; }
    .pb-footer { text-align:center; margin-top:40px; font-size:0.8rem; color:#888; letter-spacing:2px; text-transform:uppercase; }
  </style>
</head>
<body>

<div id="app">
  <div class="container">
    <header>
      <h1>📋 My Bills</h1>
      <div>
        <span class="user-info" id="userDisplay"></span>
        <a href="/" style="color:var(--accent);margin-right:15px;">Home</a>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </header>

    <div class="card">
      <h3>💰 Current Bill</h3>
      <div id="currentBill">
        <p style="color:#64748b;">Loading...</p>
      </div>
    </div>

    <div class="card">
      <h3>📜 Bill History</h3>
      <table>
        <thead><tr><th>Month</th><th>Units</th><th>Total</th><th>Status</th><th>Download</th></tr></thead>
        <tbody id="historyTable">
          <tr><td colspan="5" style="text-align:center;color:#64748b;">No bills yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Bill Modal -->
<div id="billModal" class="modal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="color:#94a3b8; font-size:0.85rem; font-weight:600;">Bill Preview</span>
      <span class="close" onclick="closeModal()">×</span>
    </div>
    <div id="printArea" class="pro-bill"></div>
    <div style="margin-top:16px; display:flex; gap:10px;">
      <button onclick="downloadImage()" style="flex:1; background:var(--success);">📸 Download Image</button>
      <button onclick="closeModal()" style="flex:1; background:var(--danger);">Close</button>
    </div>
  </div>
</div>

<script>
  // ========================================================================
  // AUTHENTICATION & ROLE CHECK
  // ========================================================================
  const API_BASE = '/api';
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = '/login.html';
  }
  const userStr = localStorage.getItem('user');
  let user = null;
  try { user = JSON.parse(userStr); } catch(e) {}
  if (!user || user.role !== 'tenant') {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/login.html';
  }

  let authToken = token;
  let currentBills = [];
  let currentHouse = '';

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/login.html';
  }

  document.getElementById('logoutBtn').addEventListener('click', logout);

  // ========================================================================
  // API HELPER
  // ========================================================================
  async function api(method, url, data) {
    const opts = {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}`
      }
    };
    if (data) opts.body = JSON.stringify(data);
    const res = await fetch(`${API_BASE}${url}`, opts);
    if (!res.ok) {
      if (res.status === 401) { logout(); throw new Error('Session expired'); }
      const err = await res.text();
      throw new Error(err || 'Request failed');
    }
    return res.json();
  }

  // ========================================================================
  // LOAD BILLS
  // ========================================================================
  async function loadBills() {
    try {
      const data = await api('GET', '/tenant/bills');
      const { bills, tenant, house } = data;

      currentBills = bills || [];
      currentHouse = house || '';

      if (!tenant || !bills.length) {
        document.getElementById('currentBill').innerHTML = `<p style="color:#64748b;">No bills found.</p>`;
        document.getElementById('historyTable').innerHTML = `<tr><td colspan="5" style="text-align:center;color:#64748b;">No bills yet</td></tr>`;
        return;
      }

      const current = bills[0];
      document.getElementById('currentBill').innerHTML = `
        <div style="background:#0f172a;padding:15px;border-radius:8px;">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;">
            <span><strong>House:</strong> ${house}</span>
            <span><strong>Month:</strong> ${current.month}</span>
            <span><strong>Total:</strong> <span class="amount">Rs. ${Number(current.total).toLocaleString()}</span></span>
            <span><span class="${current.paid_status ? 'badge-paid' : 'badge-unpaid'}">${current.paid_status ? 'Paid' : 'Unpaid'}</span></span>
            <button class="btn-download" onclick="showBillModalForTenant(${JSON.stringify(current).replace(/"/g,'&quot;')}, '${house}')">📷 Download</button>
          </div>
          <p style="margin-top:8px;font-size:0.9rem;color:#94a3b8;">Units: ${current.units} | Electricity: Rs. ${current.electricity}</p>
          ${current.note ? `<p style="margin-top:4px;font-size:0.85rem;color:var(--warn);">📌 ${current.note}</p>` : ''}
        </div>
      `;

      const tbody = document.getElementById('historyTable');
      tbody.innerHTML = bills.map(b => `
        <tr>
          <td>${b.month}</td>
          <td>${b.units}</td>
          <td>Rs. ${Number(b.total).toLocaleString()}</td>
          <td><span class="${b.paid_status ? 'badge-paid' : 'badge-unpaid'}">${b.paid_status ? 'Paid' : 'Unpaid'}</span></td>
          <td><button class="btn-download" onclick="showBillModalForTenant(${JSON.stringify(b).replace(/"/g,'&quot;')}, '${house}')">📷 Download</button></td>
        </tr>
      `).join('');
    } catch (err) {
      console.error(err);
      document.getElementById('currentBill').innerHTML = `<p style="color:var(--danger);">Error loading bills</p>`;
    }
  }

  // ========================================================================
  // BILL MODAL
  // ========================================================================
  let currentBillForModal = null;

  window.showBillModalForTenant = function(bill, house) {
    currentBillForModal = { ...bill, house };
    document.getElementById('billModal').style.display = 'flex';
    const noteHtml = bill.note ? `<div class="pb-note-box"><span class="pb-note-label">⚠️ IMPORTANT NOTICE</span><span class="pb-note-text">${bill.note}</span></div>` : '';
    const dedHtml = bill.ded > 0 ? `<tr class="pb-ded-row"><td class="pb-row-desc">Deduction (${bill.dedReason || 'Applied Discount'})</td><td class="pb-row-val">- Rs. ${Number(bill.ded).toLocaleString()}</td></tr>` : '';
    document.getElementById('printArea').innerHTML = `
      <div class="pb-head"><h2>MONTHLY BILL</h2></div>
      <div class="pb-info"><div><strong>Tenant:</strong> ${bill.name}</div><div><strong>Month:</strong> ${bill.month}</div></div>
      <div class="pb-readings"><div><div class="pb-reading-label">Previous</div><div class="pb-reading-val">${bill.prev}</div></div><div><div class="pb-reading-label">Current</div><div class="pb-reading-val">${bill.curr}</div></div><div><div class="pb-reading-label">Units</div><div class="pb-reading-val">${bill.units}</div></div></div>
      <table class="pb-table">
        <tr><td class="pb-row-desc">Electricity (${bill.units} units × 15)</td><td class="pb-row-val">Rs. ${Number(bill.electricity).toLocaleString()}</td></tr>
        <tr><td class="pb-row-desc">Room Rent</td><td class="pb-row-val">Rs. ${Number(bill.rent).toLocaleString()}</td></tr>
        <tr><td class="pb-row-desc">Water Unit Charge</td><td class="pb-row-val">Rs. ${Number(bill.water).toLocaleString()}</td></tr>
        <tr><td class="pb-row-desc">Waste Charge</td><td class="pb-row-val">Rs. ${Number(bill.waste).toLocaleString()}</td></tr>
        <tr><td class="pb-row-desc">Previous Due</td><td class="pb-row-val">Rs. ${Number(bill.due).toLocaleString()}</td></tr>
        ${dedHtml}
      </table>
      ${noteHtml}
      <div class="pb-total-section"><div class="pb-total-label">GRAND TOTAL</div><div class="pb-total-val">Rs. ${Number(bill.total).toLocaleString()}</div></div>
      <div class="pb-footer">Tenant Billing Service • Pay on time</div>
    `;
  };

  window.closeModal = function() {
    document.getElementById('billModal').style.display = 'none';
  };

  window.downloadImage = function() {
    const el = document.getElementById('printArea');
    const filenameMonth = currentBillForModal?.month?.replace(/\s+/g, '_') || 'Statement';
    html2canvas(el, { scale: 3, backgroundColor: '#ffffff', logging: false }).then(canvas => {
      const link = document.createElement('a');
      link.download = `Bill_${filenameMonth}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  };

  // Load bills
  loadBills();
</script>
</body>
</html>
