<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentSathi - Register</title>
    <style>
        :root { --bg:#0b1120; --card:#111827; --text:#f8fafc; --accent:#2563eb; --border:#1f2937; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; }
        body { background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .register-container { width:100%; max-width:460px; }
        .register-card { background:var(--card); padding:40px 32px; border-radius:16px; border:1px solid var(--border); box-shadow:0 20px 60px rgba(0,0,0,0.5); }
        .register-card h1 { font-size:2rem; font-weight:700; text-align:center; margin-bottom:8px; color:var(--text); }
        .register-card .subtitle { text-align:center; color:#94a3b8; font-size:0.9rem; margin-bottom:24px; }
        .register-card .form-group { margin-bottom:16px; }
        .register-card label { display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; color:#94a3b8; letter-spacing:0.5px; margin-bottom:4px; }
        .register-card input { width:100%; padding:12px 14px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:var(--text); font-size:1rem; transition:0.2s; }
        .register-card input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.2); }
        .register-card button { width:100%; padding:14px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-weight:600; font-size:1rem; cursor:pointer; transition:0.2s; }
        .register-card button:hover { background:#1d4ed8; transform:translateY(-1px); }
        .register-card .error { background:rgba(239,68,68,0.15); color:#ef4444; padding:10px 14px; border-radius:8px; margin-bottom:16px; display:none; font-size:0.9rem; text-align:center; }
        .register-card .footer-text { text-align:center; color:#64748b; font-size:0.8rem; margin-top:20px; }
        .register-card .footer-text a { color:var(--accent); text-decoration:none; }
        .register-card .footer-text a:hover { text-decoration:underline; }
        .spinner { display:inline-block; width:20px; height:20px; border:2px solid rgba(255,255,255,0.3); border-radius:50%; border-top-color:#fff; animation:spin 0.6s linear infinite; vertical-align:middle; margin-right:8px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .btn-text { display:inline-block; vertical-align:middle; }
        .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media(max-width:480px){ .row { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-card">
        <h1>🏠 RentSathi</h1>
        <p class="subtitle">Create your owner account</p>
        <div id="registerError" class="error"></div>
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="e.g., Ram Sharma" required>
            </div>
            <div class="form-group">
                <label>Username *</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" id="phone" placeholder="9841234567" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" placeholder="ram@example.com" required>
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address" placeholder="Kathmandu, Nepal">
            </div>
            <button type="submit" id="registerBtn">
                <span class="btn-text">Create Account</span>
            </button>
        </form>
        <p class="footer-text">
            Already have an account? <a href="/login.html">Sign In</a>
        </p>
        <p style="text-align:center;color:#64748b;font-size:0.7rem;margin-top:16px;">
            By registering, you agree to a 30-day free trial. After that, subscribe to continue.
        </p>
    </div>
</div>
<script>
    const API_BASE = '/api';
    const form = document.getElementById('registerForm');
    const errorEl = document.getElementById('registerError');
    const btn = document.getElementById('registerBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const address = document.getElementById('address').value.trim();

        if (!fullName || !username || !password || !phone || !email) {
            errorEl.textContent = 'All fields except address are required.';
            errorEl.style.display = 'block';
            return;
        }
        if (password.length < 6) {
            errorEl.textContent = 'Password must be at least 6 characters.';
            errorEl.style.display = 'block';
            return;
        }
        errorEl.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span><span class="btn-text">Creating...</span>`;

        try {
            const res = await fetch(`${API_BASE}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, username, password, phone, email, address })
            });
            const data = await res.json();
            if (!res.ok) {
                errorEl.textContent = data.error || 'Registration failed';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = `<span class="btn-text">Create Account</span>`;
                return;
            }
            // Auto-login: store token and redirect
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.href = '/index.html';
        } catch (err) {
            errorEl.textContent = 'Something went wrong. Please try again.';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = `<span class="btn-text">Create Account</span>`;
        }
    });
</script>
</body>
</html>
