<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SajiloRent">
  
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="manifest" href="/assets/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <title>SajiloRent - Login</title>
    <style>
        html { -webkit-text-size-adjust:100%; }
        :root { --bg:#0b1120; --card:#111827; --text:#f8fafc; --accent:#2563eb; --border:#1f2937; --text-muted:#94a3b8; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; }
        body { background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .login-container { width:100%; max-width:420px; }
        .login-card { background:var(--card); padding:40px 32px; border-radius:16px; border:1px solid var(--border); box-shadow:0 20px 60px rgba(0,0,0,0.5); }
        .login-card h1 { font-size:2rem; font-weight:700; text-align:center; margin-bottom:8px; color:var(--text); }
        .login-card .subtitle { text-align:center; color:#94a3b8; font-size:0.9rem; margin-bottom:24px; }
        .login-card .form-group { margin-bottom:16px; }
        .login-card label { display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; color:#94a3b8; letter-spacing:0.5px; margin-bottom:4px; }
        .login-card input { width:100%; padding:12px 14px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:var(--text); font-size:1rem; transition:0.2s; }
        .login-card input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.2); }
        .login-card button { width:100%; padding:14px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-weight:600; font-size:1rem; cursor:pointer; transition:0.2s; }
        .login-card button:hover { background:#1d4ed8; transform:translateY(-1px); }
        .login-card .error { background:rgba(239,68,68,0.15); color:#ef4444; padding:10px 14px; border-radius:8px; margin-bottom:16px; display:none; font-size:0.9rem; text-align:center; }
        .login-card .footer-text { text-align:center; color:#64748b; font-size:0.8rem; margin-top:16px; }
        .login-card .footer-text a { color:var(--accent); text-decoration:none; }
        .login-card .footer-text a:hover { text-decoration:underline; }
        .spinner { display:inline-block; width:20px; height:20px; border:2px solid rgba(255,255,255,0.3); border-radius:50%; border-top-color:#fff; animation:spin 0.6s linear infinite; vertical-align:middle; margin-right:8px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .btn-text { display:inline-block; vertical-align:middle; }
        .role-selector { display:flex; gap:12px; justify-content:center; margin-bottom:20px; }
        .role-selector button { background:#0f172a; border:1px solid #334155; border-radius:20px; padding:6px 16px; color:var(--text-muted); font-size:0.8rem; font-weight:600; cursor:pointer; transition:0.2s; }
        .role-selector button.active { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 0 3px rgba(37,99,235,0.25); }
        .role-selector button:hover:not(.active) { border-color:var(--accent); color:var(--text); }
        .role-selector button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
        .made-by-kali { position:fixed; bottom:12px; right:16px; z-index:999; display:flex; align-items:center; gap:6px; color:#6b7280; font-size:0.7rem; font-family:'SF Mono','Fira Code','Cascadia Code',monospace; letter-spacing:0.8px; opacity:0.5; transition:opacity 0.3s; pointer-events:none; }
        .made-by-kali span { color:var(--accent); font-weight:600; opacity:0.85; }
        @media(max-width:480px){ .login-card { padding:28px 20px; } .role-selector { flex-wrap:wrap; gap:8px; } .login-card .role-selector button { flex:1 1 calc(50% - 8px); min-height:44px; padding:10px 8px; white-space:nowrap; } }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;">
          <img src="/logo.svg" alt="SajiloRent" style="height:36px;width:auto;">
          <h1 style="font-size:2rem;font-weight:700;color:var(--text);margin:0;">SajiloRent</h1>
        </div>
        <p class="subtitle">Sign in to your dashboard</p>
        <div class="role-selector">
            <button class="active" data-role="owner">Owner</button>
            <button data-role="tenant">Tenant</button>
            <button data-role="admin">Admin</button>
        </div>
        <div id="loginError" class="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <button type="submit" id="loginBtn">
                <span class="btn-text">Sign In</span>
            </button>
        </form>
        <div class="footer-text">
            New owner? <a href="/register.html">Register here</a>
        </div>
    </div>
</div>
<script>
    const API_BASE = '/api';
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const roleBtns = document.querySelectorAll('.role-selector button');
    let selectedRole = 'owner';

    roleBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            roleBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            selectedRole = this.dataset.role;
            const field = document.getElementById('username');
            field.placeholder = selectedRole === 'owner' ? 'Enter your owner username' :
                                 selectedRole === 'tenant' ? 'Enter your tenant username' :
                                 'Enter your admin username';
        });
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            errorEl.textContent = 'Please enter both username and password.';
            errorEl.style.display = 'block';
            return;
        }
        errorEl.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span><span class="btn-text">Signing in...</span>`;

        try {
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) {
                errorEl.textContent = data.error || 'Invalid credentials';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = `<span class="btn-text">Sign In</span>`;
                return;
            }
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            let redirect = '/index.html';
            if (data.user.role === 'admin') redirect = '/admin.html';
            else if (data.user.role === 'superadmin') redirect = '/superadmin.html';
            else if (data.user.role === 'tenant') redirect = '/tenant.html';
            window.location.href = redirect;
        } catch (err) {
            errorEl.textContent = 'Something went wrong. Please try again.';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = `<span class="btn-text">Sign In</span>`;
        }
    });

    // Auto-redirect if already logged in
    const token = localStorage.getItem('token');
    if (token) {
        fetch(`${API_BASE}/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(user => {
            let redirect = '/index.html';
            if (user.role === 'admin') redirect = '/admin.html';
            else if (user.role === 'superadmin') redirect = '/superadmin.html';
            else if (user.role === 'tenant') redirect = '/tenant.html';
            window.location.href = redirect;
        })
        .catch(() => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
        });
    }
</script>
<div class="made-by-kali">made by <span>kali</span></div>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); }); }
</script>
</body>
</html>
