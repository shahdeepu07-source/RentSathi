name: Keep Render awake

on:
  schedule:
    # Render free tier spins down after ~15 min of idle. Ping every 9 minutes
    # (GitHub Actions cron can run a few minutes late under load) through the
    # cheap /health endpoint so the server stays warm.
    - cron: '*/9 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP keep-warm ping
        run: |
          curl -fsS --max-time 60 \
               -H "Cache-Control: no-cache" \
               "https://sajilorent.onrender.com/health" \
          && echo " site is warm"