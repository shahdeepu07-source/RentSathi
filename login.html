<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentSathi - Login</title>
    <style>
        :root { --bg:#0b1120; --card:#111827; --text:#f8fafc; --accent:#2563eb; --border:#1f2937; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; }
        body { background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .login-container { width:100%; max-width:420px; }
        .login-card { background:var(--card); padding:40px 32px; border-radius:16px; border:1px solid var(--border); box-shadow:0 20px 60px rgba(0,0,0,0.5); }
        .login-card h1 { font-size:2rem; font-weight:700; text-align:center; margin-bottom:8px; color:var(--text); }
        .login-card .subtitle { text-align:center; color:#94a3b8; font-size:0.9rem; margin-bottom:32px; }
        .login-card .form-group { margin-bottom:20px; }
        .login-card label { display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; color:#94a3b8; letter-spacing:0.5px; margin-bottom:6px; }
        .login-card input { width:100%; padding:12px 14px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:var(--text); font-size:1rem; transition:0.2s; }
        .login-card input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.2); }
        .login-card button { width:100%; padding:14px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-weight:600; font-size:1rem; cursor:pointer; transition:0.2s; position:relative; }
        .login-card button:hover { background:#1d4ed8; transform:translateY(-1px); }
        .login-card button:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .login-card .error { background:rgba(239,68,68,0.15); color:#ef4444; padding:10px 14px; border-radius:8px; margin-bottom:16px; display:none; font-size:0.9rem; text-align:center; }
        .login-card .footer-text { text-align:center; color:#64748b; font-size:0.8rem; margin-top:20px; }
        .spinner { display:inline-block; width:20px; height:20px; border:2px solid rgba(255,255,255,0.3); border-radius:50%; border-top-color:#fff; animation:spin 0.6s linear infinite; vertical-align:middle; margin-right:8px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .btn-text { display:inline-block; vertical-align:middle; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <h1>🏠 RentSathi</h1>
        <p class="subtitle">Sign in to manage your properties</p>
        <div id="loginError" class="error">Invalid username or password.</div>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        <button id="loginBtn">
            <span class="btn-text">Sign In</span>
        </button>
        <p class="footer-text">Need help? Contact your property owner.</p>
    </div>
</div>
<script>
    const API_BASE = '/api';
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');

    async function login() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        if (!username || !password) {
            errorEl.textContent = 'Please enter both username and password.';
            errorEl.style.display = 'block';
            return;
        }
        loginBtn.disabled = true;
        loginBtn.innerHTML = `<span class="spinner"></span><span class="btn-text">Signing in...</span>`;
        try {
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (!res.ok) {
                errorEl.textContent = 'Invalid credentials. Please try again.';
                errorEl.style.display = 'block';
                return;
            }
            const data = await res.json();
            const token = data.token;
            const user = data.user;
            localStorage.setItem('token', token);
            localStorage.setItem('user', JSON.stringify(user));
            let redirectUrl = '/index.html';
            if (user.role === 'admin') redirectUrl = '/admin.html';
            else if (user.role === 'tenant') redirectUrl = '/tenant.html';
            window.location.href = redirectUrl;
        } catch (err) {
            errorEl.textContent = 'Something went wrong. Please try again.';
            errorEl.style.display = 'block';
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML = `<span class="btn-text">Sign In</span>`;
        }
    }

    loginBtn.addEventListener('click', login);
    usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    // Auto-redirect if already logged in
    const token = localStorage.getItem('token');
    if (token) {
        fetch(`${API_BASE}/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(user => {
            let redirectUrl = '/index.html';
            if (user.role === 'admin') redirectUrl = '/admin.html';
            else if (user.role === 'tenant') redirectUrl = '/tenant.html';
            window.location.href = redirectUrl;
        })
        .catch(() => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
        });
    }
</script>
</body>
</html>
